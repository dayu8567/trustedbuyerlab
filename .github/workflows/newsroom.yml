name: Home appliance newsroom

on:
  push:
    branches:
      - refactor/home-appliance-blog
    paths:
      - ".github/workflows/newsroom.yml"
      - "scripts/newsroom/**"
  schedule:
    - cron: "10 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate a fixture article without committing or deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trustedbuyerlab-newsroom
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: refactor/home-appliance-blog
      CLOUDFLARE_PAGES_PROJECT: trustedbuyerlab
      PARTNERBOOST_FEED_URL: ${{ secrets.PARTNERBOOST_FEED_URL }}
      PARTNERBOOST_API_KEY: ${{ secrets.PARTNERBOOST_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[newsroom-live]')) || inputs.dry_run }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: refactor/home-appliance-blog
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate fixture dry run
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          npm run newsroom:dry
          echo "::notice title=Newsroom smoke test::Push-triggered fixture run completed without publishing."

      - name: Probe PartnerBoost feed without publishing
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          if [ -z "$PARTNERBOOST_FEED_URL" ] || [ -z "$PARTNERBOOST_API_KEY" ]; then
            echo "::notice title=PartnerBoost probe skipped::PARTNERBOOST_FEED_URL or PARTNERBOOST_API_KEY is not configured."
            exit 0
          fi
          npm run newsroom:probe

      - name: Generate live price briefs
        id: newsroom
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          if [ -z "$PARTNERBOOST_FEED_URL" ] || [ -z "$PARTNERBOOST_API_KEY" ]; then
            echo "PartnerBoost secrets are not configured; skipping."
            echo "::notice title=Newsroom skipped::PartnerBoost secrets are not configured."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run newsroom
          if git diff --quiet -- src/content/articles; then
            echo "has_articles=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_articles=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and build
        if: ${{ env.DRY_RUN != 'true' && steps.newsroom.outputs.skipped != 'true' }}
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit generated newsroom changes
        if: ${{ env.DRY_RUN != 'true' && steps.newsroom.outputs.skipped != 'true' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "trustedbuyerlab-newsroom"
          git config user.email "newsroom@trustedbuyerlab.com"
          git add src/content/articles public/images/articles data/newsroom
          git commit -m "[automated] Publish verified appliance price briefs"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Deploy preview
        if: ${{ env.DRY_RUN != 'true' && steps.newsroom.outputs.has_articles == 'true' }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets are not configured; preview deploy skipped."
            exit 0
          fi
          npx wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$TARGET_BRANCH"
