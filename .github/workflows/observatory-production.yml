name: Production Observatory validation

on:
  push:
    branches:
      - refactor/home-appliance-blog
    paths:
      - ".github/workflows/observatory-production.yml"
      - "scripts/observatory/production.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: d4f2313d85c52c5f7c54a9c4e8b30679
      OBSERVATORY_REGION: us-central1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run production Observatory
        run: node scripts/observatory/production.mjs

      - name: Upload production Observatory result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-observatory
          path: docs/production-observatory.json
          if-no-files-found: warn
