name: Cloudflare Pages preview

on:
  push:
    branches:
      - refactor/home-appliance-blog
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm test
          npm run check
          npm run build

      - name: Deploy the refactor branch preview
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets are not configured; preview deploy skipped."
            exit 0
          fi
          npx wrangler pages deploy dist \
            --project-name=trustedbuyerlab \
            --branch=refactor/home-appliance-blog
