name: Production DNS preflight

on:
  push:
    branches:
      - refactor/home-appliance-blog
    paths:
      - ".github/workflows/production-preflight.yml"
      - "scripts/production/preflight.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: d4f2313d85c52c5f7c54a9c4e8b30679
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read production configuration
        run: node scripts/production/preflight.mjs

      - name: Upload preflight report
        uses: actions/upload-artifact@v5
        with:
          name: production-preflight
          path: docs/production-preflight.json
